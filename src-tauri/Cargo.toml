[package]
name = "school21-desktop"
version = "1.1.0"
description = "Неофициальный десктоп-клиент платформы School 21"
authors = ["Dlzxn"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "school21_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
# Системный TLS (SChannel / Secure Transport / OpenSSL) — без сборки криптобиблиотек из исходников.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
# Пароль и токены — в хранилище ОС: Windows Credential Manager, macOS Keychain, Linux Secret Service.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
url = "2"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
